# ========== 单卡/双卡一键切换 · 3 h 200k ==========
# 单卡: devices=1, strategy=auto, batch_size=24, sync_batchnorm=false
# 双卡: devices=2, strategy=ddp_find_unused_parameters_true, batch_size=12, sync_batchnorm=true
# 其余配置完全一致，图幅 256²，官方精度
# config/experiment/speeda100.yaml
defaults:
  - /dataset: re10k
  - /model/autoencoder: kl_f8
  - /model/encoder: epipolar
  - /model/decoder: splatting_cuda
  - _self_

# ckpt_path: /home/gengqt/latentsplat-live/latentsplat-v0.1-a100/outputs/2025-10-11/17-27-40.462103/checkpoints/step020000.ckpt
# ------- 数据 -------
dataset:
  roots:
    - /home/gengqt/latentsplat-live/latentsplat-v0.1-a100/re10k
  # image_shape: [256, 256]
  image_shape: [160,160]
  augment: true

data_loader:
  train:
    batch_size: 48  # 单卡
    # batch_size: 12  # 双卡
    num_workers: 24
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
  val:
    batch_size: 1
    num_workers: 8
  test:
    batch_size: 1
    num_workers: 4

# ------- 训练 -------
trainer:
  accelerator: gpu
  devices: 1   # 单卡
  # devices: 2  # 双卡
  precision: bf16-mixed
  max_steps: 200_001
  val_check_interval: 100000
  log_every_n_steps: 1000
  strategy: single_device     # 单卡
  # strategy: ddp_find_unused_parameters_true  # 双卡
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
  max_split_size_mb: 128 
  sync_batchnorm: false    # 单卡
  # sync_batchnorm: true    # 双卡
  detect_anomaly: false

# ------- 模型 · 官方精度 -------
model:
  supersampling_factor: 1
  encode_latents: false
  autoencoder:
    block_out_channels: [128, 256, 512, 512]
    layers_per_block: 2
    latent_channels: 4
  encoder:
    gaussians_per_pixel: 1
    gradient_checkpointing: true   # 显存 ↓ 30 %
    epipolar_transformer:
      num_samples: 128
      num_layers: 2
      num_heads: 4
      d_dot: 128
      d_mlp: 256
      downscale: 4
      self_attention:
        patch_size: 4
        num_octaves: 10
        num_layers: 2
        num_heads: 4
        d_token: 128
        d_dot: 128
        d_mlp: 256

# ------- 优化器 -------
optimizer:
  generator:
    name: Adam
    lr: 1.5e-4
    autoencoder_lr: 9.0e-6
    scale_lr: false
    scheduler:
      name: CosineAnnealingLR
      kwargs:
        T_max: 200000
        eta_min: 1.0e-6
    gradient_clip_val: 0.5
  discriminator:
    name: Adam
    lr: 9.0e-6
    scale_lr: false

# ------- 保存 & 日志 -------
checkpointing:
  resume: true
  resume_from_last: true 
  every_n_train_steps: 10000
  save_top_k: 3

loss:
  gaussian:
    nll:
      - name: l1
        weight: 1.0
  target:
    render:
      image:
        nll:
          - name: l1
            weight: 1.0

generate_gif: false
gif_interval: 25000

