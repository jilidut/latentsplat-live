# config/main.yaml
defaults:
  - dataset: re10k
  - optional dataset/view_sampler_dataset_specific_config: ${dataset/view_sampler}_${dataset}
  - model/autoencoder: kl_f8
  - model/encoder: epipolar
  - model/decoder: splatting_cuda
  - optional model/discriminator: null

model:
  autoencoder:
      skip_connections: false
  encode_latents: false
  supersampling_factor: 1
  variational: none
  

freeze:
  autoencoder: false
  encoder: false
  decoder: false
  discriminator: false

loss:
  gaussian: null
  context: null
#    nll: []
#    generator: ...
#    discriminator: ...
  target:
    autoencoder: null
    render:
      latent: null
      image: null
    combined: null

hydra:
  run:
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S.%f}
  job_logging:
    version: 1
    formatters:
      simple:
        format: "[%(asctime)s] %(levelname)s: %(message)s"
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra:run.dir}/run.log 
    root:
      level: INFO
      handlers: [console, file]

wandb:
  project: mvsplat
  entity: jilidut 
  name: my-first-run
  mode: online
  activated: false

mode: train

dataset:
  overfit_to_scene: null


data_loader:
  # Avoid having to spin up new processes to print out visualizations.
  train:
    num_workers: 16
    persistent_workers: true
    batch_size: 2
    seed: 1234
    prefetch_factor: 2
    pin_memory: true
  test:
    num_workers: 4
    persistent_workers: false
    batch_size: 1
    seed: 2345
  val:
    num_workers: 1
    persistent_workers: true
    batch_size: 1
    seed: 3456

optimizer:
  generator:
    name: Adam
    autoencoder_lr: 9.0e-6 # orig 4.5e-6 but doubled because of 2 context views
    scale_autoencoder_lr: true
    lr: 1.5e-4
    scale_lr: false
    autoencoder_kwargs:
      betas: [0.5, 0.9]
    scheduler:
      name: LinearLR
      kwargs:
        start_factor: 5.e-4
        total_iters: 2000
    gradient_clip_val: 0.5
  discriminator:
    name: Adam
    lr: 9.0e-6 # orig 4.5e-6 but doubled because of 2 context views
    scale_lr: true
    kwargs:
      betas: [0.5, 0.9]

checkpointing:
  load: null
  resume: false
  every_n_train_steps: 10000
  save_top_k: -1

train:
  depth_mode: null
  extended_visualization: false
  # extended_visualization: true
  step_offset: 0
  video_interpolation: false
  # video_interpolation: true
  video_wobble: false
  # video_wobble: true

test:
  output_path: outputs/test
  compute_metrics: true

seed: 111123  # 全局随机种子

trainer:
  max_steps: 200_001
  log_every_n_steps: 10
  val_check_interval: 2000
  devices: 1
  strategy: auto
  # devices: 2
  # strategy: ddp
  enable_progress_bar: false
  precision: "bf16-mixed"


