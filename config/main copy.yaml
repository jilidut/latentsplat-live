# config/main.yaml
defaults:
  - dataset: re10k
  - optional dataset/view_sampler_dataset_specific_config: ${dataset/view_sampler}_${dataset}
  - model/autoencoder: kl_f8
  - model/encoder: epipolar
  - model/decoder: splatting_cuda
  - optional model/discriminator: null
  # - _self_

seed: 111123  # 全局随机种子

model:
  supersampling_factor: 1
  encode_latents: false
  encoder:
    epipolar:
      num_samples: 128         
    epipolar_transformer:       
      num_context_views: 2
      num_samples: 256
      num_layers: 1
      num_heads: 4
      downscale: 4
      d_dot: 128
      d_mlp: 256
      self_attention:
        patch_size: 4
        num_octaves: 10
        num_layers: 1
        num_heads: 4
        d_token: 128
        d_dot: 128
        d_mlp: 256
  autoencoder:
    skip_connections: false

freeze:
  autoencoder: false
  encoder: false
  decoder: false
  discriminator: false

hydra:
  run:
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S.%f}
  job_logging:
    version: 1
    formatters:
      simple:
        format: "[%(asctime)s] %(levelname)s: %(message)s"
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra:run.dir}/run.log
    root:
      level: INFO
      handlers: [console, file]

wandb:
  project: latentsplat
  entity: placeholder
  name: "latentsplat_200k_${now:%Y%m%d_%H%M%S}"
  mode: online
  activated: false
  tags: ["a100", "200k_steps", "final_training"]

mode: train

dataset:
  overfit_to_scene: null
  # image_shape: [128,128] 
  image_shape: [256,256] 

data_loader:
  train:
    num_workers: 16
    # batch_size: 16  #双卡12, 单卡24拉满
    batch_size: 2
    persistent_workers: true
    prefetch_factor: 16
    pin_memory: true
    worker_init_fn: ${hydra:runtime.seed}
  test:
    num_workers: 4
    batch_size: 1
    persistent_workers: false
    pin_memory: true
  val:
    num_workers: 1
    batch_size: 1
    persistent_workers: true
    pin_memory: true

optimizer:
  generator:
    name: Adam
    autoencoder_lr: 9.0e-6 
    scale_autoencoder_lr: true
    lr: 1.5e-4
    scale_lr: false
    autoencoder_kwargs:
      betas: [0.5, 0.9]
    scheduler:
      name: CosineAnnealingLR
      kwargs:
        T_max: 200000
        eta_min: 1.0e-6
    gradient_clip_val: null
  discriminator:
    name: Adam
    lr: 9.0e-6 
    scale_lr: true
    kwargs:
      betas: [0.5, 0.9]

checkpointing:
  load: null
  resume: false
  every_n_train_steps: 2500
  save_top_k: -1

train:
  depth_mode: null
  step_offset: 0
  extended_visualization: false
  # extended_visualization: true
  video_interpolation: false
  # video_interpolation: true
  video_wobble: false
  # video_wobble: true

test:
  output_path: outputs/test
  num_rays: 256
  num_points_per_ray: 256
  decode_tile: 512
  save_all_results: true
  compute_metrics: true

trainer:
  accelerator: gpu
  devices: 2
  precision: bf16-mixed
  max_steps: 200_001
  val_check_interval: 250
  log_every_n_steps: 2000
  # strategy: ddp_find_unused_parameters_true
  strategy: ddp   
  accumulate_grad_batches: 3
  gradient_clip_val: null
  # profiler: simple
  profiler: null
  detect_anomaly: false
  sync_batchnorm: true

loss:
  gaussian:
    nll:
      - name: l1
        weight: 1.0
        apply_after_step: 0
  target:
    render:
      image:
        nll:
          - name: l1
            weight: 1.0
            apply_after_step: 0
  gsu:
    geom_sem_contrast:
      weight: 0.2
      temperature: 0.1
    unc_sem_couple:
      weight: 0.3

