# configs/experiment/speed3060.yaml
dataset:
  name: re10k
  roots:
    - /home/gengqt/latentsplat-live/latentsplat-v0.1-a100/re10k
  skip_missing: false
  strict: false
  allow_empty: false
  make_baseline_1: true
  augment: true
  image_shape: [256,256]         
  background_color: [0.0, 0.0, 0.0]
  cameras_are_circular: false
  baseline_epsilon: 0.001
  max_fov: 100.0
  overfit_to_scene: null

  view_sampler:
    name: bounded
    num_target_views: 4
    num_context_views: 2
    min_distance_between_context_views: 45
    max_distance_between_context_views: 45
    min_distance_to_context_views: 0
    max_distance_to_context_views: 45
    initial_min_distance_between_context_views: 25
    initial_max_distance_between_context_views: 25
    initial_max_distance_to_context_views: 0
    context_gap_warm_up_steps: 50000
    target_gap_warm_up_steps: 50000

  data_loader:
    train:
      batch_size: 4
      num_workers: 8
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 2
      worker_init_fn: ${hydra:runtime.seed}
    val:
      batch_size: 1
      num_workers: 4
      pin_memory: true
      persistent_workers: true
    test:
      batch_size: 2
      num_workers: 4
      pin_memory: true
      persistent_workers: false

  trainer:
    precision: 16-mixed
    accumulate_grad_batches: 4
    check_val_every_n_epoch: 5

# ==========  model  ==========
model:
  autoencoder:
    name: kl
    model: kl_f8
    down_block_types:
      - DownEncoderBlock2D
      - DownEncoderBlock2D
      - DownEncoderBlock2D
      - DownEncoderBlock2D
    up_block_types:
      - UpDecoderBlock2D
      - UpDecoderBlock2D
      - UpDecoderBlock2D
      - UpDecoderBlock2D
    block_out_channels: [128, 256, 512, 512]
    layers_per_block: 2
    latent_channels: 4

  encoder:
    name: epipolar
    backbone:
      name: dino
      model: dino_vitb16          # ← 关键：patch=16 → 14×14
    d_backbone: 512
    d_feature: 128
    num_monocular_samples: 32
    num_surfaces: 1
    predict_opacity: false
    near_disparity: 3.0
    gaussians_per_pixel: 1
    gaussian_adapter:
      gaussian_scale_min: 0.5
      gaussian_scale_max: 15.0
      color_sh_degree: 4
      feature_sh_degree: 2
    epipolar_transformer:
      self_attention:
        patch_size: 4
        num_octaves: 10
        num_layers: 1
        num_heads: 4
        d_token: 128
        d_dot: 128
        d_mlp: 256
      num_octaves: 10
      num_layers: 1
      num_heads: 4
      # num_samples: 484
      num_samples: 196
      d_dot: 128
      d_mlp: 256
      downscale: 4
      num_context_views: 2
    visualizer:
      # num_samples: 484
      num_samples: 196
      min_resolution: 256
      export_ply: false
      vis_epipolar_samples: false
      vis_epipolar_color_samples: false
      vis_gaussians: false
      vis_overlaps: false
      vis_depth: false
    apply_bounds_shim: true
    use_epipolar_transformer: true
    use_transmittance: false
    predict_sh: true
    sh_degree: 4
    epipolar:
      num_samples: 196

  decoder:
    name: splatting_cuda
  supersampling_factor: 1
  encode_latents: false

# ==========  experiment  ==========
experiment:
  trainer:
    precision: 16
    amp_backend: native
    accumulate_grad_batches: 1
    max_steps: 6000
    val_check_interval: 2000
    log_every_n_steps: 10

  model:
    encoder:
      epipolar:
        num_samples: 196
        epipolar_transformer:
          num_layers: 1
          num_heads: 4
      backbone:
        name: dino
        model: dino_vitb16   # ← 确保生效

  loss:
    gaussian:
      nll:
        - name: l1
          weight: 1.0
          apply_after_step: 0
    target:
      render:
        image:
          nll:
            - name: l1
              weight: 1.0
              apply_after_step: 0

  dataset:
    image_shape: [256,256]   

seed: 111123

freeze:
  autoencoder: false
  encoder: false
  decoder: false
  discriminator: false

wandb:
  project: latentsplat
  entity: placeholder
  name: latentsplat_200k_${now:%Y%m%d_%H%M%S}
  mode: online
  activated: true
  tags:
    - a100
    - 200k_steps
    - final_training

mode: train

data_loader:
  train:
    num_workers: 8
    batch_size: 4
    persistent_workers: true
    prefetch_factor: 2
    pin_memory: true
    worker_init_fn: ${hydra:runtime.seed}
  test:
    num_workers: 4
    batch_size: 2
    persistent_workers: false
    pin_memory: true
  val:
    num_workers: 4
    batch_size: 1
    persistent_workers: true
    pin_memory: true

optimizer:
  generator:
    name: Adam
    autoencoder_lr: 9.0e-06
    scale_autoencoder_lr: true
    lr: 0.00015
    scale_lr: false
    autoencoder_kwargs:
      betas: [0.5, 0.9]
    scheduler:
      name: CosineAnnealingLR
      kwargs:
        T_max: 200000
        eta_min: 1.0e-06
    gradient_clip_val: 0.5
  discriminator:
    name: Adam
    lr: 9.0e-06
    scale_lr: true
    kwargs:
      betas: [0.5, 0.9]

checkpointing:
  load: null
  resume: false
  every_n_train_steps: 10000
  save_top_k: 5

train:
  depth_mode: null
  extended_visualization: false
  step_offset: 0
  video_interpolation: false
  video_wobble: false

test:
  output_path: outputs/test
  num_rays: 256
  num_points_per_ray: 256
  decode_tile: 512
  save_all_results: true

trainer:
  accelerator: gpu
  devices: 2
  precision: bf16-mixed
  max_steps: 200001
  val_check_interval: 5000
  log_every_n_steps: 5
  strategy: ddp_find_unused_parameters_true
  accumulate_grad_batches: 1
  gradient_clip_val: null
  profiler: simple
  detect_anomaly: true
  sync_batchnorm: true

loss:
  gaussian:
    nll:
      - name: l1
        weight: 1.0
        apply_after_step: 0
  target:
    render:
      image:
        nll:
          - name: l1
            weight: 1.0
            apply_after_step: 0

generate_gif: false
gif_interval: 25000